<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>[HLDS - 전사 AI 활용 실무 과정] 사전 진단 결과 조회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* HLDS 키컬러(#B71549)를 채도·명도를 낮춰 사용 */
  :root {
    --key: #A32D52; --key-deep: #7A2340; --key-tint: #F3E3E9;
    --ink: #221D1F; --sub: #6B6366; --line: #221D1F; --hair: #DED6D9; --track: #EEE8EA; --paper: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 19px; }
  body {
    background: #EEEBEC; color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-variant-numeric: tabular-nums; line-height: 1.5; word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .page {
    width: 900px; max-width: 100%; margin: 0 auto 40px; background: var(--paper);
    padding: 56px 64px 48px; border-top: 10px solid var(--key);
  }
  .toolbar { width: 900px; max-width: 100%; margin: 24px auto 14px; display: flex; justify-content: flex-end; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    font: inherit; font-size: 0.85rem; font-weight: 700; padding: 11px 20px; border: 0;
  }
  .btn.primary { color: #FFFFFF; background: var(--key); }
  .btn.primary:hover { background: var(--key-deep); }
  .btn.ghost { color: var(--ink); background: #FFFFFF; border: 1px solid var(--hair); }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn svg { width: 16px; height: 16px; }
  .eyebrow { display: flex; justify-content: flex-end; align-items: center; }
  .eyebrow .logo { height: 26px; width: auto; display: block; }
  h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.22; margin: 18px 0 38px; }

  /* 1) 정보 입력 */
  .gate { margin-top: 64px; }
  .gate .page { width: 640px; padding: 48px 56px 40px; }
  .gate h1 { font-size: 2.1rem; margin-bottom: 14px; }
  .gate .lead { font-size: 1rem; color: var(--sub); margin-bottom: 34px; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; }
  .field input {
    width: 100%; font: inherit; font-size: 1.15rem; font-weight: 600; color: var(--ink);
    padding: 14px 16px; border: 1.5px solid var(--hair); background: #FFFFFF; outline: none;
  }
  .field input:focus { border-color: var(--key); }
  .field .hint { font-size: 0.8rem; color: var(--sub); margin-top: 6px; }
  .gate .btn.primary { width: 100%; font-size: 1.05rem; padding: 16px 20px; margin-top: 6px; }
  .msg { min-height: 1.6em; margin-top: 14px; font-size: 0.9rem; font-weight: 600; color: var(--key-deep); }
  .gate footer { margin-top: 30px; display: block; }

  /* 2) 결과 */
  .sec-title { display: flex; align-items: baseline; gap: 14px; border-top: 3px solid var(--line); padding-top: 12px; margin-bottom: 18px; font-size: 1.05rem; font-weight: 700; }
  .sec-title .no { font-size: 0.82rem; font-weight: 700; color: var(--key); letter-spacing: 0.08em; }
  section { margin-bottom: 40px; }
  .ident { display: grid; grid-template-columns: 1fr 1fr 1.25fr; border-bottom: 1px solid var(--hair); }
  .ident div { padding: 4px 0 18px; }
  .ident div + div { border-left: 1px solid var(--hair); padding-left: 24px; }
  .label { font-size: 0.88rem; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  .val { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
  .val.class { display: inline; color: var(--key-deep); background: linear-gradient(transparent 55%, var(--key-tint) 55%); padding: 0 4px; }
  .cls-note { font-size: 0.7rem; font-weight: 500; color: #8A8285; line-height: 1.45; margin-top: 8px; }
  .rule { margin-top: 16px; background: #F8F4F6; padding: 14px 18px 16px; }
  /* 분반 배정 기준 칸 글씨: 10/15 처음 크기의 80% */
  .rule-head { font-size: 0.67rem; color: var(--sub); margin-bottom: 8px; }
  .rule-head b { color: var(--ink); font-weight: 800; margin-right: 10px; }
  .rule-row { display: grid; grid-template-columns: repeat(5, 1fr); }
  .rule-row div { padding: 0 10px; }
  .rule-row div:first-child { padding-left: 0; }
  .rule-row div + div { border-left: 1px solid var(--hair); }
  .rule-row p { font-size: 0.62rem; font-weight: 600; color: var(--sub); white-space: nowrap; }
  .rule-row b { font-size: 0.8rem; font-weight: 800; color: var(--key-deep); white-space: nowrap; }
  .rule-row small { font-size: 0.59rem; font-weight: 600; color: var(--sub); margin-left: 3px; }
  .total { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: end; }
  .big { font-size: 6.2rem; font-weight: 800; letter-spacing: -0.05em; line-height: 0.9; }
  .big span { font-size: 1.6rem; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
  .cmp { padding-bottom: 6px; }
  .cmp .line1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; color: var(--key-deep); }
  .cmp .line2 { font-size: 1rem; color: var(--sub); }
  .scale { position: relative; height: 26px; margin-top: 30px; }
  .bar { position: relative; height: 16px; background: var(--track); }
  .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--key); }
  .bar .avg { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px; background: #FFFFFF; border: 1.5px solid var(--ink); }
  .bar .avg .lbl { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); line-height: 1.5; font-size: 0.8rem; font-weight: 700; white-space: nowrap; color: #FFFFFF; background: var(--ink); padding: 0 6px; }
  .ticks { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sub); margin-top: 8px; }
  .area { display: grid; grid-template-columns: 1.35fr 1.45fr 0.75fr 0.8fr; gap: 24px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--hair); }
  .area:first-of-type { padding-top: 4px; }
  .area .name { font-size: 1.2rem; font-weight: 800; }
  .area .name em { font-style: normal; color: var(--key); font-weight: 800; margin-right: 6px; }
  .area .desc { font-size: 0.88rem; color: var(--sub); margin-top: 4px; line-height: 1.45; }
  .area .bar { margin-top: 22px; }
  .area .score { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.03em; text-align: right; line-height: 1; }
  .area .score span { font-size: 0.95rem; color: var(--sub); font-weight: 600; letter-spacing: 0; margin-left: 2px; }
  .area .delta { text-align: right; }
  .area .delta b { display: block; font-size: 1.35rem; font-weight: 800; }
  .area .delta b.up { color: var(--key-deep); }
  .area .delta small { font-size: 0.84rem; color: var(--sub); }
  .legend { display: flex; gap: 26px; font-size: 0.88rem; color: var(--sub); margin-top: 14px; }
  .legend i { display: inline-block; width: 22px; height: 10px; background: var(--key); vertical-align: middle; margin-right: 8px; }
  .legend i.mk { width: 6px; height: 18px; background: #FFFFFF; border: 1.5px solid var(--ink); margin: 0 10px 0 8px; }
  footer { border-top: 1px solid var(--ink); padding-top: 14px; font-size: 0.86rem; color: var(--sub); line-height: 1.7; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  footer .date { font-weight: 600; color: var(--ink); white-space: nowrap; letter-spacing: 0.02em; }

  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; }
    .toolbar, #gate { display: none !important; }
    .page { width: 900px; margin: 0 auto; padding: 30px 44px 22px; zoom: 0.78; }
    h1 { margin: 10px 0 28px; }
    section { margin-bottom: 28px; }
    .area { padding: 16px 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media screen and (max-width: 760px) {
    html { font-size: 17px; }
    .page, .gate .page { margin: 0; padding: 32px 18px; width: auto; }
    .gate { margin-top: 0; }
    .toolbar { margin: 0; padding: 12px 16px; }
    .ident { grid-template-columns: 1fr 1fr; }
    .ident div:nth-child(3) { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--hair); padding-top: 14px; }
    .rule-row { grid-template-columns: 1fr 1fr; row-gap: 10px; }
    .rule-row div, .rule-row div:first-child { padding: 0; }
    .rule-row div:first-child { grid-column: 1 / -1; }
    .rule-row div + div { border-left: 0; }
    .total { grid-template-columns: 1fr; gap: 12px; }
    .area { grid-template-columns: 1fr auto; }
    .area .barwrap { grid-column: 1 / -1; order: 3; }
  }
</style>
</head>

    <p class="lead">이름과 휴대폰 번호 뒤 4자리를 입력하면 본인의 진단 결과를 확인할 수 있습니다.</p>

        <label for="inPhone">휴대폰 번호 뒤 4자리</label>

<script>

  // 이름|번호 → PBKDF2-SHA256 48바이트: 앞 12바이트 = 조회 ID, 뒤 32바이트 = AES-256-CBC 키

      if (!rec) return null;
      var key = await crypto.subtle.importKey('raw', bits.slice(16, 48), { name: 'AES-CBC' }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(rec.iv) }, key, b64(rec.ct));

    var C = window.CryptoJS;

  var RULE_HTML = '<div class="rule"><p class="rule-head"><b>분반 배정 기준</b>아래 기준 모두 충족 시 응용 과정, 미충족 영역이 있을 경우 기본 과정으로 배정</p>' +
    '<div class="rule-row">' + RULES.map(function (c) {
      return '<div><p>' + c[0] + '</p><b>' + c[1] + '점 이상<small>/' + c[2] + '</small></b></div>';
    }).join('') + '</div></div>';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  function diffTxt(d) { return Math.abs(d) < 0.05 ? '평균과 같음' : '평균보다 ' + f1(Math.abs(d)) + '점 ' + (d > 0 ? '높음' : '낮음'); }
  function sign(d) { return Math.abs(d) < 0.05 ? '±0.0' : (d > 0 ? '+' : '−') + f1(Math.abs(d)); }
  function render(r) {
    var rows = AREAS.map(function (a) {
      var k = a[0], mx = a[2], d = r[k] - AVG[k];
      return '<div class="area"><div><p class="name"><em>' + k + '</em>' + a[1] + '</p><p class="desc">' + a[3] + '</p></div>' +
        '<div class="barwrap"><div class="bar"><div class="fill" style="width:' + f1(r[k] / mx * 100) + '%"></div>' +
        '<div class="avg" style="left:' + f1(AVG[k] / mx * 100) + '%"><span class="lbl">평균 ' + f1(AVG[k]) + '</span></div></div></div>' +
        '<p class="score">' + f1(r[k]) + '<span>/' + mx + '</span></p>' +
        '<p class="delta"><b class="' + (d >= 0.05 ? 'up' : '') + '">' + sign(d) + '</b><small>' + diffTxt(d) + '</small></p></div>';
    }).join('');
    return '<div class="eyebrow"><img class="logo" src="' + LOGO + '" alt="FAST CAMPUS"></div>' +
      '<h1>[HLDS - 전사 AI 활용 실무 과정]<br>사전 진단 결과</h1>' +
      '<section><div class="sec-title"><span class="no">01</span>기본 정보</div><div class="ident">' +
        '<div><p class="label">이름</p><p class="val">' + esc(r.name) + '</p></div>' +
        '<div><p class="label">사번</p><p class="val">' + esc(r.empno) + '</p></div>' +
        '<div><p class="label">배정 분반</p><p class="val class">' + esc(r.cls) + '</p>' +
          (r.note ? '<p class="cls-note">' + esc(r.note).replace(', ', ',<br>') + '</p>' : '') + '</div></div>' + RULE_HTML + '</section>' +
      '<section><div class="sec-title"><span class="no">02</span>총점</div><div class="total">' +
        '<p class="big">' + f1(r.T) + '<span>/ 100</span></p><div class="cmp"><p class="line1">' + diffTxt(r.T - AVG.T) + '</p>' +
        '<p class="line2">전체 평균 ' + f1(AVG.T) + '점 · 응답자 ' + AVG.n + '명 기준</p></div></div>' +
        '<div class="scale"><div class="bar"><div class="fill" style="width:' + f1(r.T) + '%"></div>' +
        '<div class="avg" style="left:' + f1(AVG.T) + '%"><span class="lbl">평균 ' + f1(AVG.T) + '</span></div></div></div>' +
        '<div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></section>' +
      '<section><div class="sec-title"><span class="no">03</span>영역별 점수와 전체 평균 비교</div>' + rows +
        '<div class="legend"><span><i></i>내 점수</span><span><i class="mk"></i>전체 평균</span></div></section>' +
      '<footer><p>※ 영역별 막대는 각 영역 만점(A·B 40점, C 20점)을 기준으로 표현됩니다.<br>' +
        '※ 본 진단은 교육 수준에 맞는 분반 배정을 위해 실시했습니다.</p><p class="date">' + ISSUED + '</p></footer>';
  }

  // ===== 화면 전환 =====
  var gate = document.getElementById('gate'), result = document.getElementById('result');
  var form = document.getElementById('lookupForm'), msg = document.getElementById('msg'), btn = document.getElementById('lookupBtn');
  var current = null, fails = 0, lockUntil = 0;

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var v = norm(document.getElementById('inName').value, document.getElementById('inPhone').value);
    if (!v.n) { msg.textContent = '이름을 입력해 주세요.'; return; }
    if (v.p.length !== 4) { msg.textContent = '휴대폰 번호 뒤 4자리를 숫자로 입력해 주세요.'; return; }
    if (Date.now() < lockUntil) { msg.textContent = '입력이 여러 번 일치하지 않았습니다. 잠시 후 다시 시도해 주세요.'; return; }
    btn.disabled = true; btn.textContent = '조회 중…'; msg.textContent = '';
    try {
      var r = await unlock(v.n, v.p);
      if (!r) {
        fails += 1;
        if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; }
        msg.textContent = '일치하는 정보가 없습니다. 이름과 번호를 다시 확인해 주세요.';
        return;
      }
      current = r;
      document.getElementById('report').innerHTML = render(r);
      gate.hidden = true; result.hidden = false; window.scrollTo(0, 0);
      document.title = '[HLDS - 전사 AI 활용 실무 과정] 사전 진단 결과 · ' + r.name;
    } catch (err) {
      console.error(err);
      msg.textContent = '조회 중 문제가 생겼습니다. 최신 브라우저(Chrome·Edge)에서 다시 열어 주세요.';
    } finally { btn.disabled = false; btn.textContent = '조회하기'; }
  });

  // ===== PDF 다운로드 =====
  window.makeReportPdf = async function () {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    var page = document.getElementById('report');
    var canvas = await html2canvas(page, { scale: 2.5, backgroundColor: '#FFFFFF', useCORS: true, windowWidth: 1000 });
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var PW = 210, PH = 297, M = 10, r = Math.min((PW - 2 * M) / canvas.width, (PH - 2 * M) / canvas.height);
    var w = canvas.width * r, h = canvas.height * r;
    doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', (PW - w) / 2, M, w, h);
    return doc;
  };
  var pdfBtn = document.getElementById('pdfBtn');
  pdfBtn.addEventListener('click', async function () {
    if (!current) return;
    if (!window.html2canvas || !window.jspdf) { window.print(); return; }
    var label = pdfBtn.innerHTML; pdfBtn.disabled = true; pdfBtn.textContent = 'PDF 만드는 중…';
    try { (await window.makeReportPdf()).save(FILE_BASE + '_' + current.name + '.pdf'); }
    catch (err) { console.error(err); window.print(); }
    finally { pdfBtn.disabled = false; pdfBtn.innerHTML = label; }
  });
})();
</script>
</body>
</html>
